services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/ubuntu/3tier-project/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

  frontend:
    build: ./app/frontend
    image: ${DOCKERHUB_USER:-local}/3tier-frontend:latest
    container_name: frontend
    restart: always
    networks:
      - app-network

  backend:
    build: ./app/backend
    image: ${DOCKERHUB_USER:-local}/3tier-backend:latest
    container_name: backend
    restart: always
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://database:27017/devops_db
    depends_on:
      - database
    networks:
      - app-network

  database:
    image: mongo:7
    container_name: database
    restart: always
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

networks:
  app-network:
    external: true
    name: 3tier-pipeline_app-network

volumes:
  mongo-data:
