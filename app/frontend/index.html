<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8' />
  <title>3-Tier DevOps Application</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
      padding: 50px;
    }

    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      display: inline-block;
    }

    h1 { color: #38bdf8; }

    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    pre {
      background: #0f172a;
      padding: 15px;
      border-radius: 6px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class='card'>
    <h1>3-Tier Web Application</h1>
    <p>Served via Nginx Reverse Proxy with End-to-End Monitoring</p>
    <button onclick='fetchData()'>Test Backend API (/api/users)</button>
    <div id='output'></div>
  </div>

  <script>
    async function fetchData() {
      try {
        const response = await fetch('/api/users');
        const data = await response.json();
        document.getElementById('output').innerHTML =
          '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
      } catch (err) {
        document.getElementById('output').innerHTML =
          '<p style=color:#ef4444>API Error: ' + err.message + '</p>';
      }
    }
  </script>
</body>
</html>
